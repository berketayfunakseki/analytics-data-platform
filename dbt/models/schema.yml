version: 2
models:
  - name: stg_orders
    description: Cleaned and typed order events.
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
      - name: status
        tests:
          - accepted_values:
              values: ['paid', 'refunded']
  - name: fct_daily_sales
    description: Daily country-level sales metrics for BI and reporting.
    columns:
      - name: order_date
        tests: [not_null]
      - name: country
        tests: [not_null]
